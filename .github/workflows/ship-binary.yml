name: ship-binary
on:
  push:
    branches: [ship]
permissions:
  contents: write
  actions: read
jobs:
  ship:
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifact and store it in branch bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir out
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o out/build.zip "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14105210245/zip"
          unzip -l out/build.zip | tail -3
          ls -la out
          cd out
          split -b 45m -d build.zip part-
          rm build.zip
          sha256sum part-* > SHA256SUMS
          git init -q -b bin
          git config user.name ship; git config user.email ship@users.noreply.github.com
          git add . && git commit -qm "windows-x86_64 build"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bin
